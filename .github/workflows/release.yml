name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows installer and Android APK
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Cordova dependencies
        working-directory: mobile-cordova
        run: npm ci

      - name: Prepare Cordova Android platform
        working-directory: mobile-cordova
        run: npx cordova platform add android@13.0.0

      - name: Sync generated app copies
        shell: pwsh
        run: |
          npm run android:sync
          npm run cordova:sync

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win:installer

      - name: Build Android APK
        run: npm run android:build:release

      - name: Generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath dist/ProstoCraft.Bot.Studio-Setup-*.exe -Destination release-assets/
          Copy-Item -LiteralPath dist-android/*.apk -Destination release-assets/
          $files = Get-ChildItem -Path release-assets -File | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProstoCraft-Bot-Studio-Release
          path: |
            release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
