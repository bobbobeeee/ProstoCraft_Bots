name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows installer and Android APK
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Install Cordova dependencies
        working-directory: mobile-cordova
        run: npm ci

      - name: Install mobile runtime dependencies
        working-directory: mobile-cordova/nodejs-project
        run: npm ci --omit=dev

      - name: Prepare Cordova Android platform
        working-directory: mobile-cordova
        run: npx cordova platform add android@13.0.0

      - name: Sync generated app copies
        shell: pwsh
        run: |
          npm run android:sync
          npm run cordova:sync

      - name: Restore Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEYSTORE_PASSWORD -or -not $env:ANDROID_KEY_ALIAS -or -not $env:ANDROID_KEY_PASSWORD) {
            throw "Android signing secrets are missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
          }

          New-Item -ItemType Directory -Force -Path android-signing | Out-Null
          [IO.File]::WriteAllBytes(
            "android-signing/prostocraft-release.keystore",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          $keystorePath = (Resolve-Path "android-signing/prostocraft-release.keystore").Path.Replace('\', '/')
          $buildConfig = @{
            android = @{
              release = @{
                keystore = $keystorePath
                storePassword = $env:ANDROID_KEYSTORE_PASSWORD
                alias = $env:ANDROID_KEY_ALIAS
                password = $env:ANDROID_KEY_PASSWORD
                keystoreType = ""
              }
            }
          }

          $buildConfig | ConvertTo-Json -Depth 8 | Set-Content -Path mobile-cordova/build.json -Encoding utf8

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win:installer

      - name: Build Android APK
        run: npm run android:build:release

      - name: Generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Path dist/ProstoCraft.Bot.Studio-Setup-*.exe -Destination release-assets/
          Copy-Item -Path dist-android/*.apk -Destination release-assets/
          $files = Get-ChildItem -Path release-assets -File | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProstoCraft-Bot-Studio-Release
          path: |
            release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
